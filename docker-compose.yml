services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nabaat}
      POSTGRES_USER: ${POSTGRES_USER:-nabaat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nabaat-local-only}
    volumes:
      - nabaat-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nabaat} -d ${POSTGRES_DB:-nabaat}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://nabaat:nabaat-local-only@db:5432/nabaat}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,https://kareemzeki-boop.github.io}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nabaat-postgres:
