openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Contact enquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a contact enquiry
      description: Validates and stores an enquiry for follow-up. No automatic email is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquirySubmission"
      responses:
        "201":
          description: Enquiry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceived"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnquirySubmission:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        topic:
          type: string
          enum: [Plant or flower, Care question, Gift idea, Something else]
        sample:
          type: string
          maxLength: 80
        message:
          type: string
          minLength: 10
          maxLength: 5000
        website:
          type: string
          maxLength: 200
          description: Hidden anti-spam honeypot; leave empty.
      required: [name, email, topic, message]
    EnquiryReceived:
      type: object
      properties:
        status:
          type: string
          const: received
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required: [status]
    ApiError:
      type: object
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties: true
      required: [error]
